# Dependabot opens a pull request when a package has an update.
# Security fixes come as soon as they're published; ordinary updates
# are grouped into one pull request per month to keep the noise down.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    groups:
      all-updates:
        patterns: ["*"]
        update-types: ["minor", "patch"]
